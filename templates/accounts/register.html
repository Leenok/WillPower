{% extends 'main/base.html' %}
{% load static %}

{% block title %}Регистрация{% endblock %}

{% block content %}
    <div class="container pt-2">

        {% load crispy_forms_tags %}
        <h2 class="text-center pt-4">Регистрация</h2>

        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}

            <button type="submit" class="btn btn-primary text-center btn-sbm">Зарегистрироваться</button>
        </form>
    </div>
{% endblock %}
